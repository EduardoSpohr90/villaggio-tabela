<style>
  :root{--verde:#1E3328;--bege:#E7DFD0;--bege-2:#CFC4B0;--pedra:#8F9A82;--terracota:#B2643B;--terracota-2:#C97A4E;--linha:rgba(231,223,208,.22);
    --serif:"Cormorant Garamond",Cormorant,Garamond,"Times New Roman",serif;--sans:Jost,"Helvetica Neue",Arial,system-ui,sans-serif;color-scheme:dark;}
  html,body{margin:0;height:100%;background:var(--verde);}
  body{color:var(--bege);font-family:var(--serif);-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  .tela{position:relative;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;max-width:640px;margin:0 auto;overflow:hidden;}
  .fundo{position:absolute;inset:0;background:#12211a url("img/6011dc3d4e6a.jpg") 40% 30%/cover no-repeat;}
  .fundo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,33,26,.55) 0%,rgba(18,33,26,.05) 26%,rgba(30,51,40,.7) 52%,var(--verde) 74%);}
  .topo{position:absolute;top:22px;left:24px;right:24px;z-index:1;}
  .eyebrow{font-family:var(--sans);font-weight:400;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--pedra);margin:0;}
  .topo .eyebrow{color:var(--bege);opacity:.9;}
  .conteudo{position:relative;z-index:1;padding:0 24px 40px;display:flex;flex-direction:column;gap:14px;}
  .wordmark{font-weight:400;text-transform:uppercase;letter-spacing:.12em;line-height:.95;font-size:40px;margin:0;}
  .wordmark span{display:block;}
  .lead{font-weight:300;font-size:26px;line-height:1.2;margin:0;}
  .lead em{font-style:italic;}
  form{margin-top:18px;display:flex;flex-direction:column;gap:12px;}
  label{font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bege-2);}
  input[type=password]{width:100%;font-family:var(--sans);font-size:17px;letter-spacing:.08em;color:var(--bege);background:rgba(18,33,26,.6);
    border:1px solid var(--linha);border-radius:2px;padding:15px 16px;outline:none;}
  input[type=password]:focus{border-color:var(--bege-2);}
  .lembrar{display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:12px;letter-spacing:.06em;color:var(--pedra);text-transform:none;}
  .lembrar input{width:16px;height:16px;accent-color:var(--terracota);margin:0;}
  button{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:17px 20px;border:0;border-radius:2px;cursor:pointer;
    font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.2em;text-transform:uppercase;background:var(--terracota);color:#FBF6EC;}
  button:hover{background:var(--terracota-2);} button:disabled{opacity:.7;cursor:progress;}
  button svg{width:18px;height:18px;flex:0 0 auto;}
  button:focus-visible,input:focus-visible{outline:2px solid var(--terracota-2);outline-offset:3px;}
  .aviso{min-height:18px;font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;color:#E2A27C;margin:0;}
  .rodape{font-family:var(--sans);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--pedra);margin:8px 0 0;}
  @media (min-width:680px){body{background:#15261D;} .tela{box-shadow:0 0 0 1px var(--linha);} .wordmark{font-size:48px;}}
</style>
</head>
<body>
<main class="tela">
  <div class="fundo" aria-hidden="true"></div>
  <div class="topo"><p class="eyebrow">Hotel | Residência</p></div>
  <div class="conteudo">
    <p class="eyebrow" style="color:var(--bege);opacity:.85">Rota dos Vales · Chapecó · SC</p>
    <h1 class="wordmark"><span>Villaggio</span><span>Toscano</span></h1>
    <p class="lead">Tabela de <em>residências</em></p>
    <noscript><p class="aviso">Ative o JavaScript do navegador para abrir a tabela.</p></noscript>
    <form id="form" autocomplete="off">
      <label for="senha">Acesso de corretores parceiros</label>
      <input id="senha" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Senha" required>
      <label class="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar neste aparelho</label>
      <button id="entrar" type="submit"><span>Abrir a tabela</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
    </form>
    <p class="rodape">VT Empreendimentos · Dimensão Construtora</p>
  </div>
</main>

    var s = window.crypto && window.crypto.subtle;
    if (!s) return Promise.reject(new Error("sem-cripto"));
    return s.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"])
      .then(function(base){ return s.deriveKey({ name: "PBKDF2", salt: bytes(P.s), iterations: P.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); })
      .then(function(chave){ return s.decrypt({ name: "AES-GCM", iv: bytes(P.i) }, chave, bytes(P.d)); })
      .then(function(claro){ return new TextDecoder().decode(claro); });
  }
  function mostrar(html){ document.open(); document.write(html); document.close(); window.scrollTo(0, 0); }
  function ocupado(sim, texto){ botao.disabled = sim; botao.firstChild.textContent = texto; }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var senha = campo.value.trim(); if (!senha) return;
    aviso.textContent = ""; ocupado(true, "Abrindo…");
    abrir(senha).then(function(html){ guardar(lembrar.checked ? senha : null); mostrar(html); })
      .catch(function(err){
        ocupado(false, "Abrir a tabela");
        aviso.textContent = err && err.message === "sem-cripto"
          ? "Abra este link no Safari ou no Chrome para ver a tabela."
          : "Senha incorreta. Confira com a equipe comercial.";
        campo.select();
      });
  });

  var salva = lido();
  if (salva) {
    ocupado(true, "Abrindo…");
    abrir(salva).then(mostrar).catch(function(){ guardar(null); ocupado(false, "Abrir a tabela"); });
  }
})();
</script>
